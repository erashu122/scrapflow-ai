spring:
  application.name: scrapflow-api
  data.mongodb.uri: ${MONGODB_URI:mongodb://scrapflow:scrapflow@localhost:27017/scrapflow?authSource=admin}
server:
  port: ${PORT:8080}
springdoc.swagger-ui.path: /swagger-ui.html
app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    remembered-refresh-token-ttl: P30D
    refresh-cookie-name: refresh_token
    secure-cookies: ${SECURE_COOKIES:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    verification-token-ttl: P1D
    password-reset-token-ttl: PT30M
    bootstrap-admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  buyer-storage:
    root-path: ${BUYER_DOCUMENT_ROOT:/var/lib/scrapflow/documents}
